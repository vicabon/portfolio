name: Tests

# Pull request（包含 Dependabot 的升級 PR）先跑離線測試，合併前就知道升級有沒有弄壞東西。
# 不抓即時報價、不建置、不部署；部署只在 deploy.yml（推到 main 時也會再跑一次同一組測試）。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (offline; Python and core.js against tests/golden)
        run: python -m pytest -m "not network" -p no:cacheprovider
