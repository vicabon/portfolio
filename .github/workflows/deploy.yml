name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每日每小時自動重新抓取報價與歷史並建置（每小時第 17 分，cron 以 UTC 計）
    # 註：避開整點 :00——GitHub 在整點負載最高，排程常被延遲或直接丟棄。
    #     若需穩定每小時更新，請由外部排程觸發 workflow_dispatch：見 scripts/trigger_deploy.sh。
    - cron: '17 * * * *'
  workflow_dispatch:

# 預設不給任何權限，各 job 只拿自己需要的（build 不需要部署權限）
permissions: {}

# 同一時間只允許一個部署運行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout public code repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (offline; Python, core.js golden, and WebCrypto interop)
        run: python -m pytest -m "not network" -p no:cacheprovider

      - name: Checkout private data repository (read-only Deploy Key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: vicabon/portfolio_private_data
          ssh-key: ${{ secrets.PRIVATE_DATA_SSH_KEY }}
          path: _private_data
          persist-credentials: false

      - name: Build static website from private data (plaintext staging in dist/)
        run: |
          python build_static.py \
            --data-dir _private_data \
            --debt _private_data/debt.json \
            --output dist/index.html

      - name: Data quality gate (validate plaintext snapshot and debt.json before encryption)
        run: python validate_static.py dist/index.html --debt _private_data/debt.json

      - name: Encrypt embedded STATIC_DATA (AES-256-GCM + PBKDF2-SHA256)
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          python crypto_static.py encrypt dist/index.html --passphrase-env SITE_PASSPHRASE

      - name: Encryption & no-leak verification gate
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          python validate_static.py dist/index.html --encrypted --no-leak-from _private_data
          python crypto_static.py verify dist/index.html --passphrase-env SITE_PASSPHRASE

      - name: Stage minimal dist/ artifact and remove private data directory
        run: |
          cp core.js dist/core.js
          : > dist/.nojekyll
          rm -rf _private_data
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact (only dist/ with encrypted index.html and core.js)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
